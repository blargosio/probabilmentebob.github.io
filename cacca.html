<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#120b05"
    >

    <title>...</title>


    <style>

        /* =====================================================
           COLORS
        ===================================================== */

        :root {
            --pink: #ff0080;
            --cyan: #00ffff;
            --yellow: #ffe600;
            --green: #00ff66;
            --orange: #ff6600;
            --purple: #a000ff;
            --red: #ff003c;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #3b210e 0%,
                    #1d1008 35%,
                    #090604 75%,
                    #020202 100%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           ANIMATED BACKGROUND
        ===================================================== */

        .background {

            position: fixed;

            inset: -50%;

            background:
                conic-gradient(
                    from 0deg,

                    rgba(255,0,128,0.10),
                    transparent 12%,

                    rgba(0,255,255,0.10),
                    transparent 25%,

                    rgba(255,230,0,0.08),
                    transparent 40%,

                    rgba(160,0,255,0.10),
                    transparent 55%,

                    rgba(255,102,0,0.10),
                    transparent 70%,

                    rgba(0,255,102,0.08),
                    transparent 85%,

                    rgba(255,0,128,0.10)
                );

            filter:
                blur(90px);

            animation:
                backgroundSpin 25s linear infinite;

            pointer-events:
                none;
        }


        /* =====================================================
           FUTURISTIC GRID
        ===================================================== */

        .grid {

            position: fixed;

            inset: 0;

            opacity: 0.07;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.3) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.3) 1px,
                    transparent 1px
                );

            background-size:
                50px 50px;

            transform:
                perspective(500px)
                rotateX(55deg)
                scale(1.5);

            transform-origin:
                center bottom;

            animation:
                gridMove 5s linear infinite;

            pointer-events:
                none;
        }


        /* =====================================================
           VIGNETTE
        ===================================================== */

        .vignette {

            position: fixed;

            inset: 0;

            z-index: 100;

            pointer-events:
                none;

            box-shadow:
                inset 0 0 180px #000,
                inset 0 0 70px rgba(0,0,0,0.8);
        }


        /* =====================================================
           MAIN POOP
        ===================================================== */

        .poop {

            position: fixed;

            left: 50%;
            top: 50%;

            width:
                clamp(
                    130px,
                    22vw,
                    240px
                );

            /*
             * Extra height gives the subtitle room.
             */
            height:
                clamp(
                    185px,
                    27vw,
                    275px
                );

            transform:
                translate(-50%, -50%);

            z-index:
                50;

            cursor:
                pointer;

            user-select:
                none;

            filter:
                drop-shadow(
                    0 18px 18px
                    rgba(0,0,0,0.55)
                );

            /*
             * Only this element floats.
             * JavaScript never overwrites this transform.
             */

            animation:
                poopFloat 4s ease-in-out infinite;

            will-change:
                transform;
        }


        /* =====================================================
           POOP IMAGE
        ===================================================== */

        .poop img {

            position: absolute;

            left: 50%;
            top: 0;

            width: 100%;
            height: auto;

            display: block;

            transform:
                translateX(-50%);

            animation:
                poopSpin 7s linear infinite;

            pointer-events:
                none;

            will-change:
                transform;
        }


        /* =====================================================
           SUBTITLE BOX
        ===================================================== */

        .poop-subtitle {

            position: absolute;

            left: 50%;

            /*
             * The box sits underneath the poop image.
             */
            bottom: 0;

            transform:
                translateX(-50%);

            width:
                88%;

            /*
             * Flexible height.
             * The text can wrap naturally.
             */
            min-height:
                46px;

            max-height:
                58px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                6px 9px;

            color:
                rgba(255,255,255,0.82);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.025)
                );

            border:
                1px solid
                rgba(0,255,255,0.38);

            border-radius:
                5px;

            box-shadow:

                0 0 14px
                rgba(0,255,255,0.12),

                inset 0 0 12px
                rgba(0,255,255,0.05);

            font-family:
                "Arial Black",
                Arial,
                Helvetica,
                sans-serif;

            /*
             * Small enough to fit.
             */
            font-size:
                clamp(
                    6px,
                    0.75vw,
                    9px
                );

            font-weight:
                700;

            line-height:
                1.25;

            letter-spacing:
                0.04em;

            text-align:
                center;

            text-transform:
                uppercase;

            /*
             * IMPORTANT:
             * Text is allowed to wrap.
             */
            white-space:
                normal;

            overflow:
                hidden;

            overflow-wrap:
                break-word;

            word-break:
                normal;

            text-overflow:
                clip;

            text-shadow:
                0 0 8px
                rgba(255,255,255,0.25);

            pointer-events:
                none;

            z-index:
                20;
        }


        /* =====================================================
           SUBTITLE NEON LINE
        ===================================================== */

        .poop-subtitle::before {

            content:
                "";

            position:
                absolute;

            top:
                -1px;

            left:
                20%;

            width:
                60%;

            height:
                1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    transparent
                );

            box-shadow:
                0 0 7px
                var(--cyan);
        }


        /* =====================================================
           POOP AMBIENT GLOW
        ===================================================== */

        .poop::before {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                35%;

            width:
                70%;

            height:
                55%;

            transform:
                translate(-50%, -50%);

            border-radius:
                50%;

            background:
                rgba(120,60,15,0.08);

            filter:
                blur(45px);

            z-index:
                -1;

            pointer-events:
                none;
        }


        /* =====================================================
           CLICK RING
        ===================================================== */

        .click-ring {

            position: fixed;

            left: 50%;
            top: 50%;

            width:
                220px;

            height:
                220px;

            border:
                3px solid
                rgba(255,150,0,0.45);

            border-radius:
                50%;

            transform:
                translate(-50%, -50%)
                scale(0.5);

            opacity:
                0;

            pointer-events:
                none;

            z-index:
                45;
        }


        .click-ring.active {

            animation:
                clickExplosion
                0.6s
                ease-out;
        }


        /* =====================================================
           CLICK ANIMATION
        ===================================================== */

        .poop.clicked img {

            animation:
                poopClick
                0.35s
                cubic-bezier(.2,1.5,.5,1);
        }


        /* =====================================================
           BLARGOCIAO
        ===================================================== */

        .blargociao {

            position:
                absolute;

            z-index:
                10;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            padding:
                6px;

            color:
                white;

            font-family:
                Impact,
                "Arial Black",
                sans-serif;

            font-weight:
                900;

            text-align:
                center;

            white-space:
                nowrap;

            text-shadow:
                2px 2px 0 #000;

            border:
                2px solid
                rgba(255,255,255,0.4);

            box-shadow:
                0 0 15px currentColor,
                inset 0 0 10px
                rgba(255,255,255,0.15);

            user-select:
                none;

            pointer-events:
                none;

            animation:
                fly
                var(--duration)
                linear
                infinite;
        }


        /* =====================================================
           MINI POOPS
        ===================================================== */

        .mini-poop {

            position:
                absolute;

            z-index:
                4;

            font-size:
                clamp(
                    18px,
                    2.5vw,
                    40px
                );

            opacity:
                0.22;

            pointer-events:
                none;

            animation:
                miniFloat
                var(--duration)
                linear
                infinite;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes backgroundSpin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }


        @keyframes gridMove {

            from {
                background-position:
                    0 0,
                    0 0;
            }

            to {
                background-position:
                    0 50px,
                    50px 0;
            }
        }


        @keyframes poopFloat {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    translateY(0);
            }

            50% {

                transform:
                    translate(-50%, -50%)
                    translateY(-10px);
            }
        }


        @keyframes poopSpin {

            0% {

                transform:
                    translateX(-50%)
                    rotate(0deg)
                    scale(1);
            }

            25% {

                transform:
                    translateX(-50%)
                    rotate(90deg)
                    scale(1.04);
            }

            50% {

                transform:
                    translateX(-50%)
                    rotate(180deg)
                    scale(1.08);
            }

            75% {

                transform:
                    translateX(-50%)
                    rotate(270deg)
                    scale(1.04);
            }

            100% {

                transform:
                    translateX(-50%)
                    rotate(360deg)
                    scale(1);
            }
        }


        @keyframes poopClick {

            0% {

                transform:
                    translateX(-50%)
                    scale(1)
                    rotate(0deg);
            }

            45% {

                transform:
                    translateX(-50%)
                    scale(1.18)
                    rotate(10deg);
            }

            100% {

                transform:
                    translateX(-50%)
                    scale(1)
                    rotate(0deg);
            }
        }


        @keyframes fly {

            0% {

                transform:
                    translate(
                        var(--xStart),
                        var(--yStart)
                    )
                    rotate(0deg)
                    scale(0.7);
            }

            50% {

                transform:
                    translate(
                        var(--xMid),
                        var(--yMid)
                    )
                    rotate(180deg)
                    scale(1.15);
            }

            100% {

                transform:
                    translate(
                        var(--xEnd),
                        var(--yEnd)
                    )
                    rotate(360deg)
                    scale(0.7);
            }
        }


        @keyframes miniFloat {

            0% {

                transform:
                    translate(
                        var(--xStart),
                        var(--yStart)
                    )
                    rotate(0deg);

                opacity:
                    0;
            }

            20% {

                opacity:
                    0.22;
            }

            80% {

                opacity:
                    0.22;
            }

            100% {

                transform:
                    translate(
                        var(--xEnd),
                        var(--yEnd)
                    )
                    rotate(360deg);

                opacity:
                    0;
            }
        }


        @keyframes clickExplosion {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(0.4);

                opacity:
                    1;
            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(2);

                opacity:
                    0;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .poop {

                width:
                    150px;

                height:
                    190px;
            }


            .poop-subtitle {

                width:
                    88%;

                min-height:
                    48px;

                max-height:
                    62px;

                padding:
                    6px 8px;

                font-size:
                    7px;

                line-height:
                    1.25;
            }


            .blargociao {

                border-width:
                    1px;

                text-shadow:
                    1px 1px 0 #000;
            }
        }


        /* =====================================================
           VERY SMALL SCREENS
        ===================================================== */

        @media (max-height: 500px) {

            .poop {

                width:
                    125px;

                height:
                    155px;
            }


            .poop-subtitle {

                min-height:
                    40px;

                max-height:
                    48px;

                font-size:
                    6px;

                padding:
                    4px 6px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.001ms !important;

                animation-iteration-count:
                    1 !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="background"></div>

    <div class="grid"></div>


    <!-- =====================================================
         MAIN POOP
    ===================================================== -->

    <div
        class="poop"
        id="poop"
        onclick="vaiDaMagnus()"
    >

        <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Twemoji_1f4a9.svg/960px-Twemoji_1f4a9.svg.png"
            alt="💩"
        >


        <!-- =================================================
             CHANGE THIS TEXT
             ================================================= -->

        <div class="poop-subtitle">

            Sei arrivato alla fine.
            Volevo aggiungere altra roba
            ma sono troppo pigro.
            Ora devi battere il boss finale.
            Buona fortuna.

        </div>

    </div>


    <!-- =====================================================
         CLICK RING
    ===================================================== -->

    <div
        class="click-ring"
        id="clickRing"
    ></div>


    <!-- =====================================================
         VIGNETTE
    ===================================================== -->

    <div class="vignette"></div>


    <script>


        /* =====================================================
           CLICKING THE POOP
        ===================================================== */

        function vaiDaMagnus() {

            const poop =
                document.getElementById("poop");

            const ring =
                document.getElementById("clickRing");


            /*
             * Restart poop click animation.
             */

            poop.classList.remove("clicked");

            void poop.offsetWidth;

            poop.classList.add("clicked");


            /*
             * Restart click ring.
             */

            ring.classList.remove("active");

            void ring.offsetWidth;

            ring.classList.add("active");


            /*
             * Open Magnus after animation.
             */

            setTimeout(() => {

                window.location.href =
                    "https://www.chess.com/play/computer/world-champion-carlsen";

            }, 350);

        }


        /* =====================================================
           BLARGOCIAO
        ===================================================== */

        const colors = [

            "#ff0080",
            "#00ffff",
            "#ffcc00",
            "#ff6600",
            "#00ff00",
            "#a000ff",
            "#ff003c"

        ];


        const blargoCount = 16;


        for (
            let i = 0;
            i < blargoCount;
            i++
        ) {

            const b =
                document.createElement("div");


            b.className =
                "blargociao";


            b.textContent =
                "blargociao";


            const size =
                Math.floor(
                    Math.random() * 55
                ) + 35;


            b.style.width =
                size + "px";


            b.style.height =
                size + "px";


            b.style.fontSize =
                Math.max(
                    8,
                    size / 5
                ) + "px";


            const color =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            b.style.background =
                color;


            b.style.boxShadow =
                `0 0 18px ${color}`;


            const xStart =
                Math.random() *
                window.innerWidth -
                size;


            const yStart =
                Math.random() *
                window.innerHeight -
                size;


            const xMid =
                Math.random() *
                window.innerWidth -
                size;


            const yMid =
                Math.random() *
                window.innerHeight -
                size;


            const xEnd =
                Math.random() *
                window.innerWidth -
                size;


            const yEnd =
                Math.random() *
                window.innerHeight -
                size;


            b.style.setProperty(
                "--xStart",
                xStart + "px"
            );


            b.style.setProperty(
                "--yStart",
                yStart + "px"
            );


            b.style.setProperty(
                "--xMid",
                xMid + "px"
            );


            b.style.setProperty(
                "--yMid",
                yMid + "px"
            );


            b.style.setProperty(
                "--xEnd",
                xEnd + "px"
            );


            b.style.setProperty(
                "--yEnd",
                yEnd + "px"
            );


            const duration =
                4 + Math.random() * 7;


            b.style.setProperty(
                "--duration",
                duration + "s"
            );


            b.style.animationDelay =
                -(Math.random() * duration) +
                "s";


            document.body.appendChild(b);

        }


        /* =====================================================
           MINI POOPS
        ===================================================== */

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            const mini =
                document.createElement("div");


            mini.className =
                "mini-poop";


            mini.textContent =
                "💩";


            const xStart =
                Math.random() *
                window.innerWidth;


            const yStart =
                Math.random() *
                window.innerHeight;


            const xEnd =
                Math.random() *
                window.innerWidth;


            const yEnd =
                Math.random() *
                window.innerHeight;


            mini.style.setProperty(
                "--xStart",
                xStart + "px"
            );


            mini.style.setProperty(
                "--yStart",
                yStart + "px"
            );


            mini.style.setProperty(
                "--xEnd",
                xEnd + "px"
            );


            mini.style.setProperty(
                "--yEnd",
                yEnd + "px"
            );


            const duration =
                6 + Math.random() * 8;


            mini.style.setProperty(
                "--duration",
                duration + "s"
            );


            mini.style.animationDelay =
                -(Math.random() * duration) +
                "s";


            document.body.appendChild(mini);

        }

    </script>

</body>

</html>
