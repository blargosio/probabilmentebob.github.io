<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f2f2">
    <title>Probabilmente Bob</title>

    <style>
        :root {
            --bg: #f2f2f2;
            --green: #4caf50;
            --green-light: #66bb6a;
            --black: #080808;
            --red: #ff1744;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            position: relative;
            overflow: hidden;
            background: radial-gradient(
                circle at 50% 50%,
                #ffffff 0%,
                var(--bg) 55%,
                #e8e8e8 100%
            );
            font-family: Arial, Helvetica, sans-serif;
            color: var(--black);
        }

        .background-text {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 0;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            font-size: clamp(60px, 10vw, 190px);
            font-weight: 900;
            letter-spacing: -0.07em;
            color: rgba(0, 0, 0, 0.075);
            animation: backgroundFloat 7s ease-in-out infinite;
        }

        .background-text::after {
            content: "PROBABILMENTE BOB";
            position: absolute;
            inset: 0;
            color: transparent;
            -webkit-text-stroke: 2px rgba(0, 0, 0, 0.025);
            transform: translate(5px, 5px);
        }

        .noise {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.045;
            background-image: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.5) 3px
            );
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.08);
        }

        .bob-button {
            position: absolute;
            z-index: 5;
            min-width: 145px;
            padding: 9px 15px;
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 8px;
            background: linear-gradient(
                135deg,
                var(--green-light),
                var(--green)
            );
            color: white;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            text-align: center;
            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.12),
                0 7px 16px rgba(0, 0, 0, 0.08);
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        .bob-button:hover {
            background: linear-gradient(
                135deg,
                #76d47b,
                #43a047
            );
            transform: translateY(-3px) scale(1.04);
            box-shadow:
                0 7px 0 rgba(0, 0, 0, 0.12),
                0 12px 24px rgba(0, 0, 0, 0.13);
        }

        .bob-button:active {
            transform: translateY(2px) scale(0.98);
            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.12),
                0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 20;
            width: min(90vw, 460px);
            height: min(90vw, 460px);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 190px;
            height: 190px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 23, 68, 0.035);
            filter: blur(25px);
            animation: glowPulse 2.2s ease-in-out infinite;
        }

        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 30;
            transform: translate(-50%, -50%);
            padding: 20px 32px;
            min-width: 260px;
            border: 2px solid #111;
            border-radius: 13px;
            background: linear-gradient(145deg, #181818, #000);
            color: white;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow:
                0 7px 0 #555,
                0 13px 30px rgba(0, 0, 0, 0.25);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
            pointer-events: auto;
        }

        .center-button:hover {
            transform: translate(-50%, -50%) scale(1.06);
            background: linear-gradient(145deg, #222, #050505);
            box-shadow:
                0 9px 0 #555,
                0 18px 35px rgba(0, 0, 0, 0.32);
        }

        .center-button:active {
            transform: translate(-50%, calc(-50% + 5px)) scale(0.98);
            box-shadow:
                0 3px 0 #555,
                0 7px 15px rgba(0, 0, 0, 0.2);
        }

        .center-button span {
            display: inline-block;
            animation: textJitter 4s infinite;
        }

        .arrows {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .arrow {
            position: absolute;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 40px;
            font-weight: 900;
            line-height: 1;
            text-shadow:
                0 2px 0 rgba(0, 0, 0, 0.1),
                0 0 12px rgba(255, 23, 68, 0.2);
            animation:
                pulse 1.1s ease-in-out infinite,
                arrowFloat 2.5s ease-in-out infinite;
        }

        .arrow:nth-child(2n) {
            animation-delay: -0.35s;
        }

        .arrow:nth-child(3n) {
            animation-delay: -0.7s;
        }

        .arrow:nth-child(4n) {
            color: #e6002d;
        }

        .status {
            position: absolute;
            left: 50%;
            bottom: 18px;
            z-index: 25;
            transform: translateX(-50%);
            padding: 6px 12px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: rgba(0, 0, 0, 0.42);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            user-select: none;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.23);
            }
        }

        @keyframes arrowFloat {
            0%, 100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.25);
            }
        }

        @keyframes backgroundFloat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.025);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        @keyframes textJitter {
            0%, 92%, 100% {
                transform: translateX(0);
            }

            94% {
                transform: translateX(-2px);
            }

            96% {
                transform: translateX(2px);
            }

            98% {
                transform: translateX(-1px);
            }
        }

        @media (max-width: 600px) {
            .background-text {
                font-size: 18vw;
                transform: translate(-50%, -50%) rotate(-4deg);
            }

            .bob-button {
                min-width: 115px;
                padding: 8px 9px;
                font-size: 10px;
            }

            .center-area {
                width: 330px;
                height: 330px;
            }

            .center-button {
                min-width: 220px;
                padding: 17px 20px;
                font-size: 15px;
            }

            .arrow {
                font-size: 30px;
            }

            .status {
                bottom: 10px;
                font-size: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background-text">
        PROBABILMENTE BOB
    </div>

    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="center-area">

        <div class="center-glow"></div>

        <div class="arrows">
            <div class="arrow" style="top: 0%; left: 50%;">⬇</div>
            <div class="arrow" style="top: 15%; left: 75%;">↙</div>
            <div class="arrow" style="top: 50%; left: 100%;">⬅</div>
            <div class="arrow" style="top: 85%; left: 75%;">↖</div>
            <div class="arrow" style="top: 100%; left: 50%;">⬆</div>
            <div class="arrow" style="top: 85%; left: 25%;">↗</div>
            <div class="arrow" style="top: 50%; left: 0%;">➡</div>
            <div class="arrow" style="top: 15%; left: 25%;">↘</div>
            <div class="arrow" style="top: 5%; left: 60%;">⬇</div>
            <div class="arrow" style="top: 60%; left: 95%;">⬅</div>
            <div class="arrow" style="top: 95%; left: 40%;">⬆</div>
            <div class="arrow" style="top: 40%; left: 5%;">➡</div>
        </div>

        <button
            class="center-button"
            onclick="vaiAScacco()"
            aria-label="Vai alla pagina scacco"
        >
            <span>molto probabilmente bob</span>
        </button>

    </div>

    <div class="status">
        100% PROBABILMENTE BOB
    </div>

    <script>
        const BOB_LINKS = [
            "https://www.chess.com/play/computer/world-champion-carlsen",
            "https://www.chess.com/play/computer/world-champion-carlsen",
            "https://www.chess.com/play/computer/world-champion-carlsen"
        ];

        const SCACCO_URL = "scacco.html";

        const spacing = 125;
        const padding = 12;

        function creaPulsante(x, y) {
            const link = document.createElement("a");

            link.href = "#";
            link.className = "bob-button";
            link.textContent = "probabilmente bob";

            link.style.left = `${x}px`;
            link.style.top = `${y}px`;

            link.addEventListener("click", function(event) {
                event.preventDefault();

                const randomIndex = Math.floor(
                    Math.random() * BOB_LINKS.length
                );

                const randomSite = BOB_LINKS[randomIndex];

                window.location.href = randomSite;
            });

            document.body.appendChild(link);
        }

        function creaBordoBob() {
            document
                .querySelectorAll(".bob-button")
                .forEach(button => button.remove());

            const width = window.innerWidth;
            const height = window.innerHeight;

            for (
                let x = padding;
                x < width - 145;
                x += spacing
            ) {
                creaPulsante(x, padding);
            }

            for (
                let x = padding;
                x < width - 145;
                x += spacing
            ) {
                creaPulsante(x, height - 48);
            }

            for (
                let y = padding + spacing;
                y < height - spacing;
                y += spacing
            ) {
                creaPulsante(padding, y);
            }

            for (
                let y = padding + spacing;
                y < height - spacing;
                y += spacing
            ) {
                creaPulsante(width - 157, y);
            }
        }

        function vaiAScacco() {
            window.location.href = SCACCO_URL;
        }

        let resizeTimer;

        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(() => {
                creaBordoBob();
            }, 100);
        });

        document.addEventListener("DOMContentLoaded", () => {
            creaBordoBob();
        });
    </script>

</body>
</html>
